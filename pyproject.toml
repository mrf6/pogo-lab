[project]
name = "pogolab"
version = "0.1.0"
description = "Pokémon GO simulations and rankings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "textual>=8.2.8",
    "textual-image>=0.14.4",
]

[project.scripts]
pogolab = "pogolab.cli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "ninja"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/pogolab"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
